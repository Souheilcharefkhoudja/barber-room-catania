<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0908">
<title>Barber Room — Pannello</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<!-- Sign in -->
<section class="login" id="login" hidden>
  <form class="login__card" id="loginForm">
    <span class="login__mark">BR</span>
    <h1 data-t="a_login_title"></h1>
    <p class="login__sub">Barber Room · Catania</p>
    <div id="loginFields"></div>
    <p class="login__err" id="loginErr" role="alert"></p>
    <button class="btn btn--gold" type="submit" data-t="a_login_go"></button>
    <p class="login__hint" id="loginHint"></p>
    <div class="lang" role="group" aria-label="Lingua / Language"><button type="button" data-lang="it">IT</button><button type="button" data-lang="en">EN</button></div>
  </form>
</section>

<!-- The panel -->
<div class="app" id="app" hidden>
  <aside class="side">
    <a class="side__brand" href="index.html" target="_blank" rel="noopener"><span>BR</span><b>Barber Room<small data-t="a_title"></small></b></a>
    <nav class="tabs" id="tabs">
      <button type="button" data-view="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-t="a_today"></span></button>
      <button type="button" data-view="agenda"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-t="a_agenda"></span></button>
      <button type="button" data-view="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 19.5a6.5 6.5 0 0 1 13 0M16 5.5a3.5 3.5 0 0 1 0 7M21.5 19.5A6.5 6.5 0 0 0 17 13.4"/></svg><span data-t="a_clients"></span></button>
      <button type="button" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="a_settings"></span></button>
    </nav>
    <a class="side__qr" href="qr.html" target="_blank" rel="noopener"><img src="assets/img/qr-prenota.svg" alt="" width="44" height="44"><span><b>QR</b><small data-t="a_qr_print"></small></span></a>
    <div class="side__foot">
      <div class="lang" role="group" aria-label="Lingua / Language"><button type="button" data-lang="it">IT</button><button type="button" data-lang="en">EN</button></div>
      <button class="btn btn--ghost btn--sm" type="button" id="logout" data-t="a_logout"></button>
    </div>
  </aside>

  <main class="main">
    <div class="demo" id="demoBar" hidden><span data-t="a_demo_banner"></span><button type="button" id="demoReset" data-t="a_demo_reset"></button></div>
    <header class="top">
      <div class="lang top__lang" role="group" aria-label="Lingua / Language"><button type="button" data-lang="it">IT</button><button type="button" data-lang="en">EN</button></div>
      <div><p class="top__kicker" id="topKicker"></p><h1 class="top__title" id="topTitle"></h1></div>
      <div class="top__actions" id="topActions">
        <button class="btn btn--line btn--sm" type="button" id="blockBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg><span data-t="a_block"></span></button>
        <button class="btn btn--gold btn--sm" type="button" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg><span data-t="a_new_booking"></span></button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<!-- Booking details -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<!-- New appointment / block time -->
<dialog class="modal" id="modal"></dialog>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
